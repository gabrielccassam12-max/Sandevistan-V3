name: Build mod

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar Gradle 8.10
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10-bin.zip -o gradle.zip
          unzip -q gradle.zip -d "$HOME"
          echo "$HOME/gradle-8.10/bin" >> "$GITHUB_PATH"

      - name: Versões
        run: |
          java -version
          gradle --version

      - name: Build
        working-directory: sandevistan
        run: gradle build --no-daemon

      - name: Upload do .jar
        uses: actions/upload-artifact@v4
        with:
          name: sandevistan-mod
          path: sandevistan/build/libs/*.jar
